# Secret scanning - dropped into a repo by operator-tools/Bootstrap-Repo.ps1.
# TruffleHog OSS: free for private repos (unlike gitleaks-action, which needs a
# paid license for org-owned repos). Scans pushes and PRs for verified secrets.
name: secret-scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  trufflehog:
    name: TruffleHog secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan
        uses: trufflesecurity/trufflehog@v3.95.8
        with:
          extra_args: --results=verified,unknown
