name: MSP Automation CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  POWERSHELL_TELEMETRY_OPTOUT: 1

jobs:
  test:
    name: Run Pester Tests
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Setup PowerShell
      uses: actions/setup-powershell@v1
      with:
        powershell-version: 'latest'
        
    - name: Install Pester
      shell: pwsh
      run: |
        Install-Module -Name Pester -Force -SkipPublisherCheck -MinimumVersion 5.3.0
        Install-Module -Name PSScriptAnalyzer -Force -SkipPublisherCheck
        
    - name: Run Pester tests
      shell: pwsh
      run: |
        $results = Invoke-Pester -Path ./tests/MSPAutomation.Tests.ps1 -OutputFormat NUnitXml -OutputFile ./TestResults.xml -PassThru
        if ($results.FailedCount -gt 0) {
          Write-Error "Pester tests failed"
          exit 1
        }
        
    - name: Upload test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: test-results
        path: TestResults.xml
        
    - name: Run PSScriptAnalyzer
      shell: pwsh
      run: |
        $results = Invoke-ScriptAnalyzer -Path ./modules -Recurse -Settings PSGallery -ErrorAction SilentlyContinue
        if ($results) {
          Write-Error "PSScriptAnalyzer found issues"
          $results | Format-Table
          exit 1
        }
        
  validate-schemas:
    name: Validate JSON Schemas
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        
    - name: Install AJV
      run: npm install -g ajv-cli
      
    - name: Validate schemas
      run: |
        ajv validate -s schemas/Get-SystemInventory.schema.json --strict=false
        ajv validate -s schemas/New-ADUser.schema.json --strict=false
        
  validate-openapi:
    name: Validate OpenAPI Specification
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        
    - name: Install Swagger CLI
      run: npm install -g @apidevtools/swagger-cli
      
    - name: Validate OpenAPI spec
      run: swagger-cli validate specs/msp-automation-openapi.yaml
      
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
        
    - name: Upload Trivy results to GitHub Security
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'
        
  build:
    name: Build and Package
    runs-on: windows-latest
    needs: [test, validate-schemas, validate-openapi, security-scan]
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Setup PowerShell
      uses: actions/setup-powershell@v1
      
    - name: Create module package
      shell: pwsh
      run: |
        $version = "2.0.$(Get-Date -Format 'yyyyMMdd')"
        $outputDir = "./output"
        New-Item -ItemType Directory -Path $outputDir -Force
        
        # Copy modules
        Copy-Item -Path "./modules" -Destination "$outputDir/modules" -Recurse
        Copy-Item -Path "./observability" -Destination "$outputDir/observability" -Recurse
        Copy-Item -Path "./schemas" -Destination "$outputDir/schemas" -Recurse
        Copy-Item -Path "./specs" -Destination "$outputDir/specs" -Recurse
        Copy-Item -Path "./security" -Destination "$outputDir/security" -Recurse
        Copy-Item -Path "./config" -Destination "$outputDir/config" -Recurse
        
        # Create version file
        $version | Out-File "$outputDir/VERSION"
        
        # Create checksum
        Get-FileHash -Path "$outputDir/*" -Algorithm SHA256 | Out-File "$outputDir/CHECKSUMS.txt"
        
    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: msp-automation-package
        path: ./output
        
  deploy:
    name: Deploy to Production
    runs-on: windows-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: production
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Download build artifacts
      uses: actions/download-artifact@v3
      with:
        name: msp-automation-package
        path: ./package
        
    - name: Deploy to servers
      shell: pwsh
      env:
        SERVER_ADDRESSES: ${{ secrets.SERVER_ADDRESSES }}
        DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
      run: |
        # Deployment script would go here
        Write-Host "Deploying to production servers"
        # This would typically involve:
        # 1. Copy files to target servers
        # 2. Update module imports
        # 3. Restart services
        # 4. Run smoke tests
        
    - name: Run smoke tests
      shell: pwsh
      run: |
        # Basic smoke tests after deployment
        Import-Module ./package/modules/MSPAutomation.Core.psm1 -Force
        $response = New-SuccessResponse -Message "Smoke test" -Data @{ test = "success" }
        if (-not $response.Success) {
          throw "Smoke test failed"
        }
        
  notify:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: [test, deploy]
    if: always()
    
    steps:
    - name: Send notification
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        text: 'MSP Automation CI/CD Pipeline completed'
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}
      if: always()