# AUTO-SYNCED from the LLM Builder Kit. Do not edit here; edit the kit source and re-run sync-standards.ps1.

# The kit's vendored CI floor (SPEC 2.6 + 3.2): every managed repo gets a
# build-test job that actually exercises the code (auto-detected stack) and a
# standards-drift job that fails CI when vendored standards diverge from the
# kit. Secret scanning is Bootstrap-Repo's separate workflow; not duplicated here.
#
# Auto-merge (SPEC 2.1) trusts THIS check: a repo qualifies for the switch only
# after this workflow has demonstrably failed on a real break.
#
# Third-party actions are SHA-pinned (supply-chain rule). Tag comments are for
# humans; the SHA is what runs.

name: ci-standards

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # One detection pass drives every conditional step below. A repo with no
      # recognizable stack passes with a notice (docs/config repos), but any
      # detected stack MUST build and its tests MUST pass.
      - name: Detect stack
        id: detect
        shell: bash
        run: |
          # FIND the stack, do not assume it sits in the working directory.
          #
          # This block used to check ./package.json and ./web/package.json and
          # nothing else. A repo whose Node code lives anywhere else -- say
          # operator-admin/ -- reported has_node=false, skipped setup-node, and
          # the Node floor PASSED VACUOUSLY with a green badge having run nothing.
          # A silent green is worse than a red: it is the wrong-report failure
          # this whole file exists to prevent, sitting inside the check itself.
          has_node=false; node_dir=.; pkg_mgr=npm
          if [ -f package.json ]; then has_node=true; node_dir=.
          else
            # Shallowest package.json wins, deterministically. Vendored and build
            # trees are excluded or the floor installs somebody else's project.
            pkg=$(find . -name package.json \
                    -not -path './.git/*' -not -path '*/node_modules/*' \
                    -not -path '*/dist/*' -not -path '*/.next/*' \
                    -printf '%d %p\n' 2>/dev/null | sort -n -k1,1 -k2,2 | head -1 | cut -d' ' -f2-)
            if [ -n "$pkg" ]; then has_node=true; node_dir=$(dirname "$pkg"); fi
          fi
          if [ "$has_node" = true ] && [ -f "$node_dir/pnpm-lock.yaml" ]; then pkg_mgr=pnpm; fi
          has_py=false
          if [ -f pyproject.toml ]; then has_py=true; fi
          # Script repos: loose .py files with no project file still get a
          # syntax floor (compileall) — a SyntaxError must fail CI.
          has_loose_py=false
          if [ "$has_py" = false ] && find . -name '*.py' -not -path './.git/*' -print -quit | grep -q .; then has_loose_py=true; fi
          # RESOLVE the .NET targets, and derive has_dotnet FROM them.
          #
          # This said `compgen -G "**/*.csproj"`, which runs with globstar OFF, so
          # `**/` collapses to a single directory level. Two failures came out of
          # that one line, in opposite directions:
          #
          #   RED FOR NOTHING: where a project WAS one level down, has_dotnet went
          #   true and the build step then ran `dotnet build` with no argument, so
          #   MSBuild looked in the working directory, found no project, and died
          #   with MSB1003 three seconds in. This floor ran 14 times between
          #   2026-07-31 and 2026-08-05 and failed 14 times, every one on that, none
          #   on the code -- while the project itself compiled clean with 0 warnings.
          #   A check that cannot tell a broken build from a broken workflow is not
          #   a check, and the operator correctly learned to ignore the badge.
          #
          #   GREEN FOR NOTHING: where a project sat TWO levels down, has_dotnet
          #   went false and the whole floor passed vacuously.
          #
          # So: find the projects explicitly, build each one by name, and let the
          # detector's answer come from what was actually found. Enumerate .csproj
          # rather than preferring a .sln -- a solution can drag in targets a Linux
          # runner cannot build (net48, WPF) and put the badge back to red for the
          # wrong reason.
          dotnet_projects=$(find . -name '*.csproj' \
                              -not -path './.git/*' -not -path '*/bin/*' -not -path '*/obj/*' \
                              2>/dev/null | sort)
          dotnet_tests=$(printf '%s\n' "$dotnet_projects" | grep -Ei '\.?tests?\.csproj$|tests?/' || true)
          has_dotnet=false
          if [ -n "$dotnet_projects" ]; then has_dotnet=true; fi
          {
            echo "dotnet_projects<<__EOF__"; printf '%s\n' "$dotnet_projects"; echo "__EOF__"
            echo "dotnet_tests<<__EOF__";    printf '%s\n' "$dotnet_tests";    echo "__EOF__"
          } >> "$GITHUB_OUTPUT"
          echo "has_node=$has_node"    >> "$GITHUB_OUTPUT"
          echo "node_dir=$node_dir"    >> "$GITHUB_OUTPUT"
          echo "pkg_mgr=$pkg_mgr"      >> "$GITHUB_OUTPUT"
          echo "has_py=$has_py"        >> "$GITHUB_OUTPUT"
          echo "has_loose_py=$has_loose_py" >> "$GITHUB_OUTPUT"
          echo "has_dotnet=$has_dotnet" >> "$GITHUB_OUTPUT"
          # Build-only opt-out: a repo whose OWN CI runs the test suite (e.g. it
          # needs private submodules or secrets this generic floor can't
          # provision, or its dedicated CI already tests more completely) drops a
          # `.github/ci-floor-build-only` marker. The floor then verifies deps
          # RESOLVE and code COMPILES (a real, cheap floor) and defers the test
          # RUN to that repo's CI — instead of duplicating it or going
          # permanently red on fixtures it can't provision.
          build_only=false
          if [ -f .github/ci-floor-build-only ]; then build_only=true; fi
          echo "build_only=$build_only" >> "$GITHUB_OUTPUT"
          if [ "$build_only" = true ]; then echo "::notice::ci-floor-build-only marker present — the repo's own CI runs the suite; the floor verifies build/resolution only."; fi
          echo "detected: node=$has_node($node_dir,$pkg_mgr) python=$has_py loose_py=$has_loose_py dotnet=$has_dotnet build_only=$build_only"
          if [ "$has_node" = false ] && [ "$has_py" = false ] && [ "$has_loose_py" = false ] && [ "$has_dotnet" = false ]; then
            echo "::notice::No buildable stack detected (node/python/dotnet); build-test passes vacuously."
          fi

      # --- Node ---
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.detect.outputs.has_node == 'true'
        with:
          node-version: 22
      - name: Node install + build + test
        if: steps.detect.outputs.has_node == 'true'
        shell: bash
        working-directory: ${{ steps.detect.outputs.node_dir }}
        run: |
          set -e
          if [ "${{ steps.detect.outputs.pkg_mgr }}" = "pnpm" ]; then
            # Current pnpm 10 (matches how the repos are managed). Corepack's
            # default (10.0.0) predates ignoredBuiltDependencies and errors on
            # these repos' workspace files — never rely on it.
            npm install -g pnpm@10
            pnpm install --frozen-lockfile
            runner="pnpm run"
          else
            if [ -f package-lock.json ]; then npm ci; else npm install; fi
            runner="npm run"
          fi
          has_script() { node -e "process.exit(((require('./package.json').scripts||{})['$1'])?0:1)"; }
          if has_script build; then $runner build; else echo "::notice::no build script"; fi
          if [ "${{ steps.detect.outputs.build_only }}" = "true" ]; then
            echo "::notice::build-only: deferring the JS test suite to the repo's own CI (install + build ran above)."
          elif has_script test; then $runner test; else echo "::warning::no test script — the trust floor is build-only here"; fi

      # --- Python (uv) ---
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        if: steps.detect.outputs.has_py == 'true'
      - name: Python sync + tests
        if: steps.detect.outputs.has_py == 'true'
        shell: bash
        run: |
          set -e
          # --all-extras: install optional-dependency extras too. A repo's test
          # deps (pytest, pytest-asyncio, xdist) very commonly live in a `dev`/
          # `test` EXTRA — which a plain `uv sync` does NOT install (it installs
          # default dependency-GROUPS, not extras). Without them an async suite
          # errors at fixture setup and this floor can never pass, making it noise
          # instead of a trust signal. Extras are no-ops where a repo has none.
          if [ -f uv.lock ]; then uv sync --frozen --all-extras; else uv sync --all-extras; fi
          if [ "${{ steps.detect.outputs.build_only }}" = "true" ]; then
            # Build-only: deps RESOLVED above; now verify the source COMPILES.
            # compileall byte-compiles without importing or running app init, so
            # it needs none of the private submodules / secrets / fixtures the
            # repo's own CI provisions — it just catches SyntaxErrors. The test
            # RUN is deferred to that CI.
            uv run python -m compileall -q . -x '(/\.git/|/node_modules/|/\.venv/|/build/|/dist/)' \
              || { echo "::error::Python syntax errors found"; exit 1; }
            echo "::notice::build-only: deps resolved + source compiled; deferring the pytest suite to the repo's own CI."
          elif [ -d tests ] || [ -d test ]; then
            # Prefer the project's own pytest (its plugins — asyncio etc. —
            # matter); overlay one only when the project doesn't declare it.
            if uv run pytest --version >/dev/null 2>&1; then
              uv run pytest -q
            else
              uv run --with pytest pytest -q
            fi
          else
            echo "::warning::no tests/ directory — the trust floor is dependency-resolution-only here"
          fi

      # --- Loose Python scripts (no project file): syntax floor ---
      - name: Python syntax floor (compileall)
        if: steps.detect.outputs.has_loose_py == 'true'
        shell: bash
        run: |
          python3 -m compileall -q . -x '(\.git|node_modules|\.venv)' || { echo "::error::Python syntax errors found"; exit 1; }
          echo "::warning::script-only repo — the trust floor is syntax-only here (no tests)"

      # --- .NET (preinstalled on ubuntu runners; no extra action to pin) ---
      - name: Dotnet build + test
        if: steps.detect.outputs.has_dotnet == 'true'
        shell: bash
        run: |
          set -e
          # Build the projects the detector FOUND, by name. A bare `dotnet build`
          # only looks in the working directory, which is how this step failed 14
          # consecutive times on MSB1003 without ever reaching a line of code.
          projects="${{ steps.detect.outputs.dotnet_projects }}"
          if [ -z "$projects" ]; then
            echo "::error::has_dotnet was true but no project paths were resolved — the detector and this step disagree."
            exit 1
          fi
          while IFS= read -r proj; do
            [ -n "$proj" ] || continue
            echo "--- building $proj"
            dotnet build "$proj" --nologo -clp:ErrorsOnly
          done <<< "$projects"

          tests="${{ steps.detect.outputs.dotnet_tests }}"
          if [ "${{ steps.detect.outputs.build_only }}" = "true" ]; then
            echo "::notice::build-only: deferring dotnet test to the repo's own CI (build ran above)."
          elif [ -n "$tests" ]; then
            # Explicit project args here too. Widening the test glob while leaving
            # `dotnet test` bare would just convert MSB1003-on-build into
            # MSB1003-on-test the first time a repo grew a test project.
            while IFS= read -r t; do
              [ -n "$t" ] || continue
              echo "--- testing $t"
              dotnet test "$t" --nologo --no-build
            done <<< "$tests"
          else
            # Keep this warning. It is the honesty mechanism that stops a green
            # badge reading as "the .NET code is tested" when it is only compiled.
            echo "::warning::no test projects — the trust floor is build-only here"
          fi

  standards-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KIT_TOKEN: ${{ secrets.KIT_READ_TOKEN }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # A CHECK THAT COULD NOT RUN MUST NOT REPORT SUCCESS.
      #
      # This used to emit a ::notice:: and let the job go GREEN when the token was
      # absent — so standards-drift reported success while having verified exactly
      # nothing, and a repo silently drifting from the kit looked compliant. That
      # is the same wrong-report shape the rest of this file exists to catch, and
      # it was living inside the enforcement layer itself.
      #
      # Unconfigured is now a FAILURE with a fix in the message, because the only
      # honest states are "checked and clean" and "did not check". A missing token
      # is a setup task, not a passing grade.
      # THE KIT DOES NOT NEED A TOKEN TO READ ITSELF.
      #
      # This job clones the kit to compare a repo's vendored standards against it.
      # On the KIT'S OWN repo that is circular: it was demanding a PAT to fetch a
      # copy of the repository the runner is already standing in, then failing for
      # want of one. sync-standards.ps1 sits right there and its -Check runs
      # against the local templates with no credential at all.
      #
      # So self-check locally, and only reach for the token when the repo is
      # genuinely downstream. This is NOT a loophole in the rule above. Two states
      # are honest — "checked and clean" and "did not check" — and the distinction
      # is whether verification HAPPENED, not whether a secret was present. Here it
      # happens, against the real source, for free.
      - name: Kit access?
        id: kit
        shell: bash
        run: |
          # Match on the REPO NAME, not owner/name. The owner changed once
          # already (GestaltWorks -> WorkflowtechAI) and a hardcoded full path
          # silently stopped matching: the kit would have gone back to demanding
          # a token to read itself, for no reason a reader could see. The org can
          # rename again; the repository is still the kit.
          if [ "${GITHUB_REPOSITORY##*/}" = "llm-builder-kit" ]; then
            echo "self=true" >> "$GITHUB_OUTPUT"
            echo "::notice::This IS the kit — checking the vendored copies against the local templates, no token needed."
          elif [ -n "$KIT_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::KIT_READ_TOKEN is not set, so drift could not be checked — and an unchecked repo must not report a passing drift job. Add a read-only token for WorkflowtechAI/llm-builder-kit as the KIT_READ_TOKEN secret."
            exit 1
          fi
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        if: steps.kit.outputs.enabled == 'true'
        with:
          repository: WorkflowtechAI/llm-builder-kit
          token: ${{ secrets.KIT_READ_TOKEN }}
          path: .kit
      - name: Vendored standards in sync with the kit
        if: steps.kit.outputs.enabled == 'true'
        shell: pwsh
        run: ./.kit/sync-standards.ps1 -RepoPath . -Check
      - name: Vendored standards in sync with the local templates (kit repo)
        if: steps.kit.outputs.self == 'true'
        shell: pwsh
        run: ./sync-standards.ps1 -RepoPath . -Check
      # Kit only: this tests the WRITER, which lives here. A vendored file that
      # arrives with a header its own parser rejects turns a consuming repo's CI
      # red for a reason that has nothing to do with that repo's code. The first
      # .py in the map shipped to two repos with an HTML comment as line 1.
      - name: Vendored headers parse in their own language (kit repo)
        if: steps.kit.outputs.self == 'true'
        shell: pwsh
        run: ./tests/Test-StandardsHeaders.ps1

